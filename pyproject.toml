[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "comerciabi-api"
version = "0.1.0"
description = "API FastAPI de ComercioBI para serving de analítica, IA, pronósticos, recomendaciones e insights."
requires-python = ">=3.14,<3.15"

dependencies = [
    "fastapi>=0.136,<1",
    "uvicorn>=0.35,<1",
    "pydantic-settings>=2.10,<3",
    "SQLAlchemy>=2.0.40,<3",
    "psycopg[binary]>=3.2.10,<4",
    "PyJWT[crypto]>=2.10,<3",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
]

[tool.setuptools]
packages = [
    "api",
    "api.app",
]

[tool.pytest.ini_options]
testpaths = ["tests/api"]
pythonpath = ["."]
addopts = "-ra"

[tool.vercel]
entrypoint = "api.index:app"
